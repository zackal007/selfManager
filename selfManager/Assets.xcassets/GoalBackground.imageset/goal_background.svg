<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- 渐变背景 -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F80FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5BFF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景矩形 -->
  <rect width="400" height="200" fill="url(#grad1)" />
  
  <!-- 装饰圆形 -->
  <circle cx="350" cy="50" r="30" fill="#FFFFFF" fill-opacity="0.1" />
  <circle cx="320" cy="80" r="20" fill="#FFFFFF" fill-opacity="0.1" />
  <circle cx="50" cy="150" r="40" fill="#FFFFFF" fill-opacity="0.1" />
  
  <!-- 装饰线条 -->
  <line x1="0" y1="100" x2="400" y2="100" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2" />
  <line x1="200" y1="0" x2="200" y2="200" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2" />
</svg>