<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>侧边栏设置 - 回收站过期时间预览</title>
  <style>
    :root {
      --bg: #ffffff;
      --grouped: #f2f2f7;
      --text: #111827;
      --secondary: #6b7280;
      --blue: #1e66ff;
      --red: #ef4444;
      --shadow: rgba(17, 24, 39, 0.06);
    }
    body { font-family: -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; margin: 24px; background: var(--grouped); }
    .card { width: 360px; background: var(--bg); border-radius: 12px; box-shadow: 0 4px 12px var(--shadow); padding-bottom: 16px; }
    .header { display:flex; align-items:center; gap:8px; padding:16px; border-bottom: 1px solid #eee; }
    .header .icon { color:#1e66ff; }
    .header .title { font-size:16px; font-weight:600; color: var(--text); }
    .section-title { font-size:14px; color:#6b7280; padding:12px 16px 4px; }
    .row { display:flex; gap:12px; align-items:center; padding:8px 16px; background:#f7f7fa; border-radius:8px; margin:0 16px; white-space:nowrap; }
    .row-icon { width:20px; color: var(--red); }
    .row-title { font-size:14px; color: var(--text); overflow:hidden; text-overflow:ellipsis; }
    .spacer { flex:1; }
    .value { font-size:14px; color: var(--blue); margin-right:8px; }
    .stepper { display:inline-flex; align-items:center; gap:6px; background:#e9eefc; border-radius:10px; padding:4px 8px; }
    .btn { border:none; background:#1e66ff; color:#fff; font-size:12px; padding:4px 8px; border-radius:8px; cursor:pointer; }
    .btn:active { transform: scale(0.98); }
  </style>
  <script>
    let days = 30;
    function render() {
      document.getElementById('days').textContent = days + ' 天';
    }
    function inc() { if (days < 365) { days++; render(); } }
    function dec() { if (days > 7) { days--; render(); } }
    window.onload = render;
  </script>
</head>
<body>
  <div class="card">
    <div class="header">
      <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2l2 2h6v2H4V4h6l2-2z" fill="#1e66ff"/>
        <path d="M5 8h14v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V8z" fill="#bcd0ff"/>
      </svg>
      <div class="title">设置</div>
      <div class="spacer"></div>
    </div>
    <div class="section-title">回收站</div>
    <div class="row">
      <svg class="row-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2l2 2h6v2H4V4h6l2-2z" fill="#ef4444"/>
        <path d="M5 8h14v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V8z" fill="#ffd4d4"/>
      </svg>
      <div class="row-title">过期时间</div>
      <div class="spacer"></div>
      <div class="value" id="days">30 天</div>
      <div class="stepper">
        <button class="btn" onclick="dec()">-</button>
        <button class="btn" onclick="inc()">+</button>
      </div>
    </div>
  </div>
</body>
</html>
